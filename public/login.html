<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Painel de Administração</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="login-box shadow-lg">
  <div class="text-center mb-4">
    <i class="fas fa-user-shield fa-3x text-accent mb-2"></i>
    <h4 class="text-light">Painel Administrativo</h4>
    <p class="text-muted" style="font-size: 0.85rem;">Sistema de Ponto Eletrônico</p>
  </div>

  <div id="login-erro" class="alert alert-danger d-none" role="alert"></div>

  <form id="form-login" onsubmit="realizarLogin(event)">
    <div class="mb-3">
      <label class="form-label">Email do Administrador</label>
      <div class="input-group">
        <span class="input-group-text bg-secondary border-secondary text-light"><i class="fas fa-envelope"></i></span>
        <input type="email" id="login-email" class="form-control" placeholder="admin@mobilitta.com" value="brunoantonio837@gmail.com" required>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Senha</label>
      <div class="input-group">
        <span class="input-group-text bg-secondary border-secondary text-light"><i class="fas fa-lock"></i></span>
        <input type="password" id="login-senha" class="form-control" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" id="btn-login" class="btn btn-danger w-100 py-2 fw-bold">
      <i class="fas fa-sign-in-alt me-2"></i>Entrar no Painel
    </button>
  </form>

  <div class="text-center mt-4">
    <a href="/" class="text-muted text-decoration-none" style="font-size: 0.85rem;">
      <i class="fas fa-arrow-left me-1"></i>Voltar para o Batedor de Ponto
    </a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBCuPyOvWhv0MVz6S-Cd8bFDgBcyF1ZCY4",
    authDomain: "ponto-mobilitta.firebaseapp.com",
    projectId: "ponto-mobilitta",
    storageBucket: "ponto-mobilitta.firebasestorage.app",
    messagingSenderId: "217323535686",
    appId: "1:217323535686:web:6c583a7ba09d64594db947"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  async function realizarLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value.trim();
    const erroDiv = document.getElementById('login-erro');
    const btn = document.getElementById('btn-login');

    erroDiv.classList.add('d-none');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Autenticando...';

    // Se senha for "admin123" ou credencial mestre, libera acesso local imediato
    if (senha === 'admin123' || senha === 'admin') {
      sessionStorage.setItem('admin_logado', 'true');
      sessionStorage.setItem('admin_email', email);
      window.location.href = '/admin.html';
      return;
    }

    try {
      // Tenta login com Firebase Auth
      await auth.signInWithEmailAndPassword(email, senha);
      sessionStorage.setItem('admin_logado', 'true');
      sessionStorage.setItem('admin_email', email);
      window.location.href = '/admin.html';
    } catch (err) {
      console.warn('Firebase Auth falhou, verificando senha padrão:', err);
      erroDiv.textContent = 'Credenciais inválidas. Use a senha de administrador configurada ou admin123.';
      erroDiv.classList.remove('d-none');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Entrar no Painel';
    }
  }
</script>
</body>
</html>
